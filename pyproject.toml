[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-manipulation-pi0"
version = "0.1.0"
description = "Language-conditioned robot manipulation policy learning with MuJoCo, imitation learning, and π0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "mujoco>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robot_manipulation_pi0.sim" = [
  "assets/*.xml",
  "assets/franka_emika_panda/*.xml",
  "assets/franka_emika_panda/*.md",
  "assets/franka_emika_panda/LICENSE",
  "assets/franka_emika_panda/*.png",
  "assets/franka_emika_panda/assets/*.obj",
  "assets/franka_emika_panda/assets/*.stl",
]
